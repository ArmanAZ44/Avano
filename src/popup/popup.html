<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آوانو | Avano</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="aurora"></div>

    <header class="hdr">
      <div class="brand">
        <div class="logo"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="brand-text">
          <div class="title">آوانو | Avano</div>
          <div class="subtitle">دوبله‌ی زنده‌ی ویدیو</div>
        </div>
      </div>
      <button class="icon-btn" id="openOptions" title="تنظیمات کامل" aria-label="تنظیمات">⚙</button>
    </header>

    <main class="body">
      <!-- status -->
      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="status-text" id="statusText">آماده</span>
        <span class="chip" id="latencyChip">—</span>
      </div>

      <!-- error -->
      <div class="err" id="err" hidden></div>
      <!-- hint -->
      <div class="hint" id="hint" hidden></div>

      <!-- live stats -->
      <div class="stats" id="stats" hidden>
        <span class="stat"><b id="statLatency">—</b><i>تأخیر</i></span>
        <span class="stat"><b id="statBacklog">—</b><i>بافر</i></span>
        <span class="stat"><b id="statReconnects">۰</b><i>اتصال مجدد</i></span>
      </div>

      <!-- primary action -->
      <button class="cta" id="cta">شروع دوبله</button>

      <!-- quick settings -->
      <div class="quick">
        <div class="seg" id="modeSeg" role="tablist">
          <button class="seg-btn active" data-mode="translate" role="tab">ترجمه‌ی هم‌زمان</button>
          <button class="seg-btn" data-mode="dub" role="tab">دوبله‌ی بیانی</button>
        </div>

        <div class="row">
          <span class="lbl">زبان</span>
          <select id="lang" class="select"></select>
        </div>

        <div class="row">
          <span class="lbl">سرعت</span>
          <select id="profile" class="select"></select>
        </div>

        <div class="row">
          <span class="lbl">صدای دوبله</span>
          <input type="range" id="dubVol" min="0" max="150" step="1" />
          <span class="val" id="dubVolVal">۱۰۰%</span>
        </div>

        <div class="row">
          <span class="lbl">صدای اصلی</span>
          <input type="range" id="origVol" min="0" max="100" step="1" />
          <span class="val" id="origVolVal">۸%</span>
        </div>

        <div class="row">
          <label class="switch">
            <input type="checkbox" id="showSubtitles" />
            <span>نمایش زیرنویس روی ویدیو</span>
          </label>
        </div>

        <div class="mini-row">
          <button class="mini" id="exportSubs" type="button">ذخیره‌ی زیرنویس</button>
          <button class="mini" id="clearSubs" type="button">پاک کردن</button>
          <span class="mini-note" id="subsNote"></span>
        </div>
      </div>

      <!-- links -->
      <div class="links">
        <a href="https://github.com/ArmanAZ44/Avano" target="_blank" rel="noreferrer" title="گیت‌هاب">
          <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          گیت‌هاب
        </a>
        <a href="https://t.me/ArmanAZPC" target="_blank" rel="noreferrer" title="تلگرام">
          <svg viewBox="0 0 24 24"><path d="M23.91 3.79 20.3 20.84c-.25 1.21-.98 1.5-2 .94l-5.5-4.07-2.66 2.57c-.3.3-.55.56-1.1.56-.72 0-.6-.27-.84-.95L6.3 13.7l-5.45-1.7c-1.18-.35-1.19-1.16.26-1.75l21.26-8.2c.97-.43 1.9.24 1.54 1.74z"/></svg>
          تلگرام
        </a>
        <a href="https://reymit.ir/armanaz44" target="_blank" rel="noreferrer" title="حمایت مالی">
          <svg viewBox="0 0 16 16"><path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/></svg>
          حمایت
        </a>
      </div>

      <div class="made-with">
        ساخته‌شده با <span class="heart">♥</span> برای وب فارسی — نسخه ۱.۰.۰
      </div>
    </main>

    <script src="../shared/browser-api.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
